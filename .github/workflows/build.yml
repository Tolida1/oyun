name: "Android Build"
on: [push]

jobs:
  export-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.1

      - name: Build Android APK
        run: |
          mkdir -v -p build/android
          # Not: Projende 'Android' isimli bir export preset olmalı
          godot --headless --export-release "Android" build/android/oyun.apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Oyun-Paketi
          path: build/android/oyun.apk
