name: Dizipal Scraper

on:
  schedule:
    - cron: '0 */6 * * *'  # 6 saatte bir çalışır
  workflow_dispatch:       # Manuel çalıştırma

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Repo checkout
      uses: actions/checkout@v3

    - name: Python kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Paketleri yükle
      run: pip install -r requirements.txt

    - name: Script çalıştır
      run: python scraper.py

    - name: Commit ve Push
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add diziler.json
        git commit -m "Otomatik güncelleme" || echo "Değişiklik yok"
        git push
