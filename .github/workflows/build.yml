name: "Android Build"
on: [push]

jobs:
  export-android:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Godot Kurulumu
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.1

      - name: Export Şablonlarını İndir (ÇOK ÖNEMLİ)
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.2.1.stable
          wget https://github.com/godotengine/godot-builds/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          unzip Godot_v4.2.1-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.2.1.stable/
          rm Godot_v4.2.1-stable_export_templates.tpz

      - name: Android Klasörünü Hazırla
        run: mkdir -v -p build/android

      - name: Android APK Oluştur
        # Not: 'Android' ismi export_presets.cfg dosyasındaki [preset.0] name ile aynı olmalı!
        run: godot --headless --export-release "Android" build/android/oyun.apk
          
      - name: Dosyaları Listele (Hata Ayıklama İçin)
        run: ls -R build/

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Oyun-Paketi
          path: build/android/oyun.apk
